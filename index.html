<script>/* Apply the saved theme before first paint (no flash). Mirrors src/app/theme.mjs. */
(function(){var p="dark";try{p=localStorage.getItem("td_theme")||"dark"}catch(e){}
var t=p==="system"?(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):(p==="light"?"light":"dark");
var d=document.documentElement;d.dataset.theme=t;d.style.colorScheme=t;
if(t==="light"){var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#eef1f6"}})();</script>
